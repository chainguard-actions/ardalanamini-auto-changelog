name: Test semver disabled with non-semver name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-name: nightly-build
          semver: 'false'
          include-compare-link: 'false'
          include-pr-links: 'false'
          include-commit-links: 'false'
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
          PRERELEASE: ${{ steps.action.outputs.prerelease }}
          RELEASE_ID: ${{ steps.action.outputs.release-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prerelease: $PRERELEASE"
          echo "release-id: $RELEASE_ID"
          echo "changelog: $CHANGELOG"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PRERELEASE" != "false" ]; then
              echo "FAIL: expected prerelease=false"; exit 1
            fi
            if [ "$RELEASE_ID" != "latest" ]; then
              echo "FAIL: expected release-id=latest"; exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
