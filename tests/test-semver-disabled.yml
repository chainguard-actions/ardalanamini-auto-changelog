name: Test semver disabled with non-semver release name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          preferred-api: Git
          release-name: my-release-beta
          semver: 'false'
          mention-new-contributors: 'false'
          include-compare-link: 'false'
      - name: Assert prerelease is false
        env:
          ACTUAL: ${{ steps.action.outputs.prerelease }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          echo "PASS"
      - name: Assert release-id is latest
        env:
          ACTUAL: ${{ steps.action.outputs.release-id }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "latest" ]; then
            echo "FAIL: expected 'latest'"
            exit 1
          fi
          echo "PASS"
      - name: Assert no compare link
        env:
          ACTUAL: ${{ steps.action.outputs.changelog }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q 'Full Changelog'; then
            echo "FAIL: compare link should be disabled"
            exit 1
          fi
          echo "PASS"
