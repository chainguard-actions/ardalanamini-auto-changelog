name: Test GitHub API mode (sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          preferred-api: GitHub
          release-name: v999.0.0
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.changelog }}
          RELEASE_ID: ${{ steps.action.outputs.release-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$(echo "$RESULT" | tr -d '[:space:]')" ]; then
              echo "FAIL: action succeeded but the changelog is empty"
              exit 1
            fi
            if [ "$RELEASE_ID" != "latest" ]; then
              echo "FAIL: expected release-id latest, got '$RELEASE_ID'"
              exit 1
            fi
            echo "PASS: got changelog"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
