name: Test GitHub API mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          preferred-api: GitHub
          release-name: v1.0.0
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          PRERELEASE: ${{ steps.action.outputs.prerelease }}
          RELEASE_ID: ${{ steps.action.outputs.release-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prerelease: $PRERELEASE, release-id: $RELEASE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PRERELEASE" != "false" ] || [ "$RELEASE_ID" != "latest" ]; then
              echo "FAIL: expected prerelease=false release-id=latest"
              exit 1
            fi
            echo "PASS: action succeeded with expected outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
