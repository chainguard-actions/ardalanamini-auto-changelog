name: Test invalid preferred-api input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          preferred-api: GitLab
          release-name: v1.0.0
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid preferred-api"
            exit 1
          fi
          if [ -n "$CHANGELOG" ]; then
            echo "FAIL: expected no changelog output"
            exit 1
          fi
          echo "PASS"
