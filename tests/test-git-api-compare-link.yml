name: Test Git API compare link footer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Tag a previous release on an ancestor of HEAD and tag HEAD
        env:
          GIT_AUTHOR_NAME: Test User
          GIT_AUTHOR_EMAIL: test@example.com
          GIT_COMMITTER_NAME: Test User
          GIT_COMMITTER_EMAIL: test@example.com
        run: |
          set -e
          echo "HEAD: $(git rev-parse HEAD)"
          echo "shallow: $(git rev-parse --is-shallow-repository || true)"
          if PARENT=$(git rev-parse --verify -q 'HEAD~1^{commit}'); then
            echo "using parent commit as previous release: $PARENT"
            OLD="$PARENT"
          else
            echo "HEAD has no parent available; using an unrelated commit"
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            OLD=$(echo "chore: previous release" | git commit-tree "$EMPTY_TREE")
          fi
          git tag -f v998.0.0 "$OLD"
          git tag -f v999.0.0 HEAD
          git tag -l 'v99*'
      - id: action
        uses: .
        with:
          preferred-api: Git
          release-name: v999.0.0
          mention-authors: 'false'
          mention-new-contributors: 'false'
          include-compare-link: 'true'
          use-github-autolink: 'true'
      - name: Assert compare link is present in changelog
        env:
          ACTUAL: ${{ steps.action.outputs.changelog }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "\*\*Full Changelog\*\*: .*/compare/v998\.0\.0\.\.\.v999\.0\.0"; then
            echo "FAIL: expected Full Changelog compare link v998.0.0...v999.0.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert release outputs
        env:
          PRERELEASE: ${{ steps.action.outputs.prerelease }}
          RELEASE_ID: ${{ steps.action.outputs.release-id }}
        run: |
          echo "prerelease: $PRERELEASE, release-id: $RELEASE_ID"
          if [ "$PRERELEASE" != "false" ] || [ "$RELEASE_ID" != "latest" ]; then
            echo "FAIL: expected prerelease=false release-id=latest"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup tags
        if: always()
        run: git tag -d v998.0.0 v999.0.0 || true
